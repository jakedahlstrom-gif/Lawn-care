<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lawn IQ</title>
  <meta name="description" content="Mowing, feeding, weeding and watering planner for a Minnesota Kentucky bluegrass lawn. Works offline; data stays on your device.">
  <meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lawn IQ">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/app-icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/app-icon-180.png">
  <!-- Link previews when the app's address is shared (Messages, Mail, Slack…). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Lawn IQ">
  <meta property="og:title" content="Lawn IQ">
  <meta property="og:description" content="Mowing, feeding, weeding and watering planner for a Minnesota Kentucky bluegrass lawn.">
  <meta property="og:url" content="https://jakedahlstrom-gif.github.io/Lawn-care/">
  <meta property="og:image" content="https://jakedahlstrom-gif.github.io/Lawn-care/img/share.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Lawn IQ app icon: a lawn mower on green grass">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="status-shield" aria-hidden="true"></div>
  <main id="views">
    <section id="view-today" class="view" data-view="today" aria-label="Today"></section>
    <section id="view-calendar" class="view" data-view="calendar" aria-label="Calendar"></section>
    <section id="view-history" class="view" data-view="history" aria-label="History"></section>
    <section id="view-yard" class="view" data-view="yard" aria-label="Yard"></section>
  </main>
  <nav class="tabbar" aria-label="Tabs"></nav>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p style="padding:24px">Lawn IQ needs JavaScript turned on.</p></noscript>
</body>
</html>
