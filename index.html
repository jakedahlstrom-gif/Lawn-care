<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lawn Care</title>
  <meta name="description" content="Mowing, feeding, weeding and watering planner for a Minnesota Kentucky bluegrass lawn. Works offline; data stays on your device.">
  <meta name="theme-color" content="#f4f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0f0c" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lawn Care">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="status-shield" aria-hidden="true"></div>
  <main id="views">
    <section id="view-today" class="view" data-view="today" aria-label="Today"></section>
    <section id="view-calendar" class="view" data-view="calendar" aria-label="Calendar"></section>
    <section id="view-history" class="view" data-view="history" aria-label="History"></section>
    <section id="view-yard" class="view" data-view="yard" aria-label="Yard"></section>
  </main>
  <nav class="tabbar" aria-label="Tabs"></nav>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p style="padding:24px">Lawn Care needs JavaScript turned on.</p></noscript>
</body>
</html>
